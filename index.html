<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Situs E-Commerce Responsif</title>
    <meta
      name="description"
      content="Platform e-commerce responsif dengan tampilan produk dinamis, navigasi intuitif, dan checkout yang mulus."
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Begin of Chaport Live Chat code -->
    <script type="text/javascript">
      (function (w, d, v3) {
        w.chaportConfig = {
          appId: '6ab5db58919f694fe13ac2e8',
          launcher: { show: false }, // launcher default disembunyikan, dibuka lewat tombol custom di UI
        };

        if (w.chaport) return;
        v3 = w.chaport = {};
        v3._q = [];
        v3._l = {};
        v3.q = function () {
          v3._q.push(arguments);
        };
        v3.on = function (e, fn) {
          if (!v3._l[e]) v3._l[e] = [];
          v3._l[e].push(fn);
        };
        var s = d.createElement('script');
        s.type = 'text/javascript';
        s.async = true;
        s.src = 'https://app.chaport.com/javascripts/insert.js';
        var ss = d.getElementsByTagName('script')[0];
        ss.parentNode.insertBefore(s, ss);
      })(window, document);
    </script>
    <!-- End of Chaport Live Chat code -->
  </body>
</html>
